name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Each Monday, so that the build checks run on the new data of the sources.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the format
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run the tests
        run: cargo test --workspace

  build-checks:
    name: Full build and build checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ingest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Find the date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # The cache key holds the date, so the workflow downloads the sources 1 time each day at most.
      # The key also holds the hashes of fetch.sh, which gives the KanjiVG release and the Kanjium
      # commit, and of fetch-tatoeba.sh.
      - name: Restore the sources of today
        id: cache
        uses: actions/cache@v6
        with:
          path: crates/ingest/sources
          key: ingest-sources-${{ hashFiles('crates/ingest/fetch.sh', 'crates/ingest/fetch-tatoeba.sh') }}-${{ steps.date.outputs.date }}
      - name: Download the sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./fetch.sh && ./fetch-tatoeba.sh
      - name: Run a full build
        run: >-
          cargo run --release -p ingest --
          --jmdict sources/JMdict_e.gz
          --kanjivg sources/kanjivg-*.xml.gz
          --kanjidic sources/kanjidic2.xml.gz
          --furigana sources/JmdictFurigana-*.txt
          --accents sources/kanjium-accents-*.txt
          --frequency sources/jiten-drama.zip
          --tatoeba sources/tatoeba-*
          --out out
      - name: Add the build report to the job summary
        run: |
          {
            echo '```'
            cat out/build-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the build checks
        run: cargo test --release -p ingest --test build_checks -- --ignored
      - name: Upload the build report and content.db
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-db
          path: |
            crates/ingest/out/build-report.txt
            crates/ingest/out/content.db
          if-no-files-found: ignore

  app:
    name: App checks
    needs: build-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Download content.db of the full build
        uses: actions/download-artifact@v8
        with:
          name: content-db
          path: app/assets
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      - name: Install the Flutter of .fvmrc
        run: fvm install
      # The codegen must have the version of the flutter_rust_bridge crate and package.
      - name: Install the bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Check that the generated bindings are up to date
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust ../crates/jpdag-ffi/src/frb_generated.rs
      - name: Run the analyzer
        run: fvm flutter analyze
      - name: Run the tests
        run: fvm flutter test
